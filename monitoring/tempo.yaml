# Grafana Tempo - single-binary trace backend with local storage.
# Receives spans over OTLP (HTTP 4318 / gRPC 4317) from the app and the worker.
#
# Deliberately minimal: only server, distributor and storage. The ingester and
# compactor tuning blocks were dropped because the config schema differs across
# Tempo versions ("field ingester not found in type app.Config") and the
# defaults are fine for a lab.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
