# Grafana Tempo - single-binary trace backend with local storage.
# Receives spans over OTLP (HTTP 4318 / gRPC 4317) from the app and the worker.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m        # cut blocks quickly so traces show up fast in a lab

compactor:
  compaction:
    block_retention: 24h        # a lab does not need weeks of traces

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
