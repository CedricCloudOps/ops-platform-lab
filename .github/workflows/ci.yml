name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Tests run first: no point building or scanning an image that is already broken.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: app
        run: pytest tests/ -v

  build:
    needs: test           # the image is only built if the tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t vault-app ./app

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vault-app
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # report only (set to '1' to fail the build on HIGH/CRITICAL)

      - name: Validate Docker Compose file
        run: docker compose config --quiet

  # Catch a broken config here rather than on the server. The CD timer deploys
  # whatever lands on main, so an invalid alert rule or nginx directive would
  # otherwise only be discovered by the running stack.
  # Each check runs inside the exact image version the stack uses, so the syntax
  # validated here is the syntax that will actually be parsed in production.
  config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.13.1 \
            check rules /etc/prometheus/alerts.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "$PWD/monitoring:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.33.1 \
            check-config /cfg/alertmanager.yml

      - name: Validate Nginx config
        run: |
          # The config loads a TLS certificate; generate a throwaway one so the
          # syntax check can complete (real certs are git-ignored).
          mkdir -p nginx/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/certs/vault.key -out nginx/certs/vault.crt \
            -subj "/CN=ci" 2>/dev/null
          docker run --rm \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27 nginx -t

      - name: Validate remaining YAML and dashboard JSON
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import json, sys, glob, yaml
          ok = True
          for f in ["monitoring/tempo.yaml", "monitoring/promtail-config.yml",
                    "monitoring/postgres-queries.yaml"] + \
                   glob.glob("monitoring/grafana/provisioning/**/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print("ok   ", f)
              except Exception as e:
                  print("FAIL ", f, e); ok = False
          for f in glob.glob("monitoring/grafana/dashboards/*.json"):
              try:
                  json.load(open(f))
                  print("ok   ", f)
              except Exception as e:
                  print("FAIL ", f, e); ok = False
          sys.exit(0 if ok else 1)
          EOF

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
